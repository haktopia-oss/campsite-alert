name: 캠핑장 빈자리 확인

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분씩 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: write            # cloud/ 상태 파일 커밋용

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 감시 1회
        env:
          DATA_DIR: cloud
          TZ: Asia/Seoul
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: 상태 저장
        run: |
          git config user.name "campsite-bot"
          git config user.email "campsite-bot@users.noreply.github.com"
          git add cloud/state.json cloud/errors.json
          [ -f cloud/alerts.json ] && git add cloud/alerts.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "상태 갱신 $(date +'%m-%d %H:%M')"
            git pull --rebase -q && git push
          fi

name: 캠핑장 빈자리 확인

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분씩 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행

concurrency:
  group: check
  cancel-in-progress: false

permissions:
  contents: write            # cloud/ 상태 파일 커밋용
  pages: write               # 폰용 대시보드(GitHub Pages) 배포
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04   # 10/19 ubuntu-latest 변경 영향 안 받게 고정
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 감시 1회
        env:
          DATA_DIR: cloud
          TZ: Asia/Seoul
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: 폰용 대시보드 만들기
        env:
          DATA_DIR: cloud
          TZ: Asia/Seoul
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python dashboard.py _site

      - uses: actions/configure-pages@v5
        continue-on-error: true   # Pages 설정 전이어도 감시는 계속
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # 배포가 실패해도 상태 저장은 계속

      - name: 상태 저장
        env:
          TZ: Asia/Seoul
        run: |
          git config user.name "campsite-bot"
          git config user.email "campsite-bot@users.noreply.github.com"
          git add cloud/state.json cloud/errors.json
          for f in cloud/alerts.json cloud/health.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "상태 갱신 $(date +'%m-%d %H:%M')"
            # 동시에 다른 업로드가 있으면 최대 3번 다시 시도
            for i in 1 2 3; do
              git pull --rebase -q && git push && break
              echo "업로드 충돌, 재시도 $i"; sleep $((i * 5))
            done
          fi

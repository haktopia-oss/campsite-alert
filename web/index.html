<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주말 캠핑 빈자리</title>
<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --card:#fff; --ink:#1d2320; --sub:#6b726e; --line:#e2e4e3;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --no:#9aa09c; --no-bg:#efeeea; --wait:#b7791f; --wait-bg:#fbf0dc;
  --accent:#2f5d50; --hol:#c2410c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
h1{font-size:22px;margin:0;flex:1 1 auto}
.meta{color:var(--sub);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.busy{background:var(--wait);animation:blink 1s infinite}
.dot.err{background:#d33}
@keyframes blink{50%{opacity:.3}}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{border-radius:999px;padding:5px 14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:26px}
h2{font-size:17px;margin:0 0 4px}
.note{color:var(--sub);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.day.ok{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.day.full,.day.closed{opacity:.72;background:#fafafa}
.day .d{font-weight:700;font-size:16px}
.day .hol{color:var(--hol);font-size:12px;margin-left:6px;font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;margin-top:6px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-no{background:var(--no-bg);color:var(--no)} .b-wait{background:var(--wait-bg);color:var(--wait)}
.day ul{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);font-size:13px}
.day li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.day li a{color:var(--ink);text-decoration:none} .day li a:hover{text-decoration:underline}
.day li .r{color:var(--ok);font-weight:700;white-space:nowrap}
.cat{color:var(--sub);font-size:11px;margin-right:4px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td{padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
tr:first-child td{border-top:0}
td a{color:var(--ink)}
.month{font-weight:700;color:var(--sub);font-size:13px;width:56px}
.alerts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.alert{padding:10px 0;border-top:1px solid var(--line);font-size:13px;white-space:pre-wrap}
.alert:first-child{border-top:0}
.alert .t{color:var(--sub);font-size:12px}
.empty{color:var(--sub);padding:14px;text-align:center}
.board{display:flex;align-items:stretch;gap:0;overflow-x:auto;border:2px solid #1f3a4a;border-radius:6px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;min-height:420px}
.col{flex:1 0 200px;max-width:280px;border-right:2px solid #1f3a4a;display:flex;flex-direction:column;scroll-snap-align:start}
.col:last-child{border-right:0}
.col-h{padding:12px 12px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.col-h a{color:var(--ink);text-decoration:none;font-weight:700;font-size:16px;line-height:1.3}
.col-h .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.col-b{padding:10px;display:flex;flex-direction:column;gap:10px}
.col .day{padding:10px 12px}
.col .day .d{font-size:15px}
.zone{display:flex;gap:6px;align-items:baseline;font-size:13px;padding:7px 4px;border-bottom:1px solid var(--line)}
.zone .m{color:var(--sub);font-size:12px;white-space:nowrap}
.zone .cat{white-space:nowrap}
.zone a{color:var(--ink)}
.col.mini{flex:0 0 46px;max-width:46px;background:#f7f7f6}
.col.mini .col-h{padding:10px 4px;border:0;background:transparent;text-align:center}
.col.mini a{writing-mode:vertical-rl;text-orientation:upright;font-size:13px;font-weight:600;color:var(--no);letter-spacing:1px}
.col.mini .full{display:block;margin-top:8px;font-size:11px;color:var(--no)}
.hint{color:var(--sub);font-size:12px;margin:6px 0}
@media (max-width:600px){
  .col{flex:0 0 158px}
  .col-b{padding:8px}
  .col .day{padding:8px 9px}
  .col-h a{font-size:15px}
  .zone{flex-wrap:wrap}
}
.err{color:#b45309;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏕️ 주말 캠핑 빈자리</h1>
    <span class="meta" id="meta">불러오는 중…</span>
    <button class="primary" id="btnCheck">지금 확인</button>
  </header>

  <div class="chips" id="chips">
    <button class="chip" data-cat="camp">캠핑</button>
    <button class="chip" data-cat="glamp">글램핑</button>
    <button class="chip" data-cat="bbq">바베큐·당일</button>
  </div>
  <div class="err" id="errors"></div>

  <p class="note">빈자리가 있는 날만 보여요. 캠핑·글램핑: 다음 날도 쉬는 밤 (토요일 밤, 월요일 공휴일 전 일요일 밤, 공휴일 금요일 밤) · 바베큐·당일: 토·일·연휴 공휴일. 전부 만석인 곳은 오른쪽에 이름만 작게.</p>
  <div class="hint" id="hint">← 옆으로 넘겨서 다른 캠핑장 보기</div>
  <div class="board" id="board"></div>

  <section>
    <h2>최근 알림</h2>
    <div class="alerts" id="alerts"></div>
  </section>
</div>

<script>
const CAT = {camp:"캠핑", glamp:"글램핑", bbq:"당일"};
const WD = "월화수목금토일";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
let cats = new Set(store.get("cats", ["camp","glamp","bbq"]));
let open = new Set();
let data = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = iso => iso ? iso.slice(11,16) : "-";

function renderChips(){
  document.querySelectorAll(".chip[data-cat]").forEach(b => b.classList.toggle("on", cats.has(b.dataset.cat)));
}

function renderMeta(){
  const dot = data.running ? "busy" : (data.last_error || Object.keys(data.errors||{}).length ? "err" : "");
  $("#meta").innerHTML = `<span class="dot ${dot}"></span>` +
    (data.running ? "확인 중… · " : "") +
    `마지막 확인 ${data.checked_at ? data.checked_at.slice(5,10).replace("-","/") + " " + hm(data.checked_at) : "-"}` +
    (data.next_check ? ` · 다음 ${hm(data.next_check)}` : "") + " · " +
    (data.cloud ? `알림: ☁️ 클라우드(10분) · 텔레그램` : `텔레그램 ${data.telegram ? "✓" : "✗"}`);
  const NAMES = {jungnang:"중랑", uidong:"우이동", angbong:"앵봉산", choan:"초안산", nanji:"난지", jingwan:"진관글램핑", dulle:"둘레캠프", sagimak:"사기막", gangdong:"강동그린웨이", seoulpark:"서울대공원"};
  const errs = Object.keys(data.errors||{}).map(k => {
    const st = data.sources?.[k]?.stale_at;
    return `⚠️ ${NAMES[k] || k}: 일시적 접속 실패` + (st ? ` — ${st.slice(5,10).replace("-","/")} ${hm(st)} 기준 데이터 표시 중` : "");
  });
  if (data.last_error) errs.push("감시 오류: " + data.last_error);
  // 클라우드가 멈추면 스스로 알릴 수 없으니 화면에서 경고 (10분 주기 → 40분 넘으면 이상)
  if (data.checked_at){
    const age = (Date.now() - new Date(data.checked_at + "+09:00").getTime()) / 60000;
    if (age > 40) errs.unshift(`🚨 ${Math.round(age)}분째 갱신이 없어요 — 감시가 멈췄을 수 있어요 (cron-job.org·GitHub 확인 필요)`);
  }
  $("#errors").textContent = errs.join(" / ");
}

const ORDER = ["jungnang", "nanji", "uidong", "angbong", "choan", "seoulpark"];

function bell(src){
  if (!data.notify) return "";
  return data.notify.includes(src) ? `<span class="badge b-ok">🔔 알림</span>` : `<span class="badge b-no">🔕</span>`;
}

function datedCards(src, j){
  const items = Object.fromEntries(j.items.map(i => [i.id, i]));
  const byDate = {};
  for (const s of j.slots){
    const it = items[s.item];
    if (!it || !cats.has(it.cat) || !s.open || s.remain <= 0) continue;
    (byDate[s.date] ??= []).push({...s, it});
  }
  return Object.keys(byDate).sort().map(ymd => {
    const avail = byDate[ymd];
    const total = avail.reduce((a,s) => a + s.remain, 0);
    const meta = data.days[ymd] || {};
    const [, m, d] = ymd.split("-").map(Number);
    const byCat = Object.keys(CAT).filter(c => cats.has(c)).map(c => {
      const n = avail.filter(s => s.it.cat === c).reduce((a,s)=>a+s.remain,0);
      return n ? `${CAT[c]} ${n}` : "";
    }).filter(Boolean).join(" · ");
    const key = src + "|" + ymd;
    const detail = open.has(key) ? `<ul>${avail.sort((a,b)=>a.it.cat.localeCompare(b.it.cat)).map(s =>
      `<li><a href="${esc(s.it.url)}" target="_blank" rel="noopener"><span class="cat">${CAT[s.it.cat]}</span>${esc(s.it.name)}</a><span class="r">${s.remain}</span></li>`
    ).join("")}</ul>` : "";
    return `<div class="day ok" data-key="${esc(key)}">
      <div class="d">${m}/${d} (${WD[meta.wd]})${meta.holiday ? `<span class="hol">${esc(meta.holiday)}</span>` : ""}</div>
      <span class="badge b-ok">빈자리 ${total}</span> <span class="meta">${byCat}</span>${detail}</div>`;
  });
}

function nanjiRows(n){
  return n.zones.filter(z => z.open && cats.has(z.cat)).map(z =>
    `<div class="zone"><span class="m">${z.month ?? ""}월</span><span class="cat">${CAT[z.cat]}</span>
      <a href="${esc(z.url)}" target="_blank" rel="noopener">${esc(z.zone)}</a></div>`);
}

function renderBoard(){
  const cols = [];
  for (const src of ORDER){
    const j = data.sources?.[src];
    if (!j) continue;
    const rows = src === "nanji" ? nanjiRows(j) : datedCards(src, j);
    const name = src === "nanji" ? "난지캠핑장" : j.name;
    cols.push({src, name, url: j.url, rows});
  }
  const LOCAL = {choan: ["초안산캠핑장", "https://nowonsc.moonhwain.kr:447/rsvc/rsv_srm.html?b_id=nowonsc"]};
  for (const src of (data.local_only || [])) {
    const [name, url] = LOCAL[src] || [src, "#"];
    cols.push({src, name, url, rows: [], localOnly: true});
  }
  const live = cols.filter(c => c.rows.length), full = cols.filter(c => !c.rows.length);
  const html = live.map(c => `<div class="col">
      <div class="col-h"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>
        <div class="sub">${bell(c.src)}${c.src === "nanji" ? `<span class="meta">접수중 존 · 날짜는 링크에서</span>` : `<span class="meta">${c.rows.length}일</span>`}</div></div>
      <div class="col-b">${c.rows.join("")}</div></div>`).join("")
    + full.map(c => `<div class="col mini" title="${esc(c.name)} — 전부 만석">
      <div class="col-h"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name.replace(/가족|캠핑장|야영장|북한산 /g,"").trim() || c.name)}</a><span class="full">${c.localOnly ? "PC에서만" : "만석"}</span></div></div>`).join("");
  $("#board").innerHTML = html || `<div class="empty">데이터 없음</div>`;
  const b = $("#board"); $("#hint").style.display = b.scrollWidth > b.clientWidth + 4 ? "" : "none";
}

function renderAlerts(){
  const a = data.alerts || [];
  $("#alerts").innerHTML = a.length ? a.map(x =>
    `<div class="alert"><div class="t">${esc(x.at.replace("T"," "))}${x.error ? ` · <span class="err">알림 실패</span>` : ""}</div>${esc(x.text)}</div>`
  ).join("") : `<div class="empty">아직 보낸 알림이 없어요</div>`;
}

function render(){ if (!data) return; renderChips(); renderMeta(); renderBoard(); renderAlerts(); }

let STATIC = false;
async function load(){
  try{
    const r = await fetch(STATIC ? "status.json?t=" + Date.now() : "/api/status");
    if (!r.ok) throw 0;
    data = await r.json();
    render();
  }catch(e){
    if (!STATIC){ STATIC = true; $("#btnCheck").style.display = "none"; return load(); }
    $("#meta").textContent = "데이터를 불러올 수 없어요";
  }
}

document.querySelectorAll(".chip[data-cat]").forEach(b => b.onclick = () => {
  const c = b.dataset.cat;
  cats.has(c) ? cats.delete(c) : cats.add(c);
  store.set("cats", [...cats]); render();
});
$("#board").onclick = e => {
  const card = e.target.closest(".day"); if (!card || e.target.closest("a")) return;
  const k = card.dataset.key; open.has(k) ? open.delete(k) : open.add(k); render();
};
$("#btnCheck").onclick = async () => {
  await fetch("/api/check", {method:"POST"});
  data && (data.running = true, renderMeta());
  const t = setInterval(async () => { await load(); if (!data.running){ clearInterval(t); } }, 1500);
};

renderChips();
load();
setInterval(load, 20000);
</script>
</body>
</html>
